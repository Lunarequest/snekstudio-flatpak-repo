name: flatpak

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"
env:
  FLATPAK_BRANCH: nightly
  FLATPAK_BUILD_REPO_x64: build-repo-x64
  FLATPAK_BUILD_REPO_arm64: build-repo-aarch64
jobs:
  check_for_updates:
    runs-on: ubuntu-latest
    outputs:
      newnightly: ${{ steps.check-url.outputs.newnightly }}
      amd64_url: ${{ steps.get-urls.outputs.amd64_url }}
      arm64_url: ${{ steps.get-urls.outputs.arm64_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get URLs
        id: get-urls
        run: |
          AMD64_URL=$(curl -s https://api.github.com/repos/ExpiredPopsicle/SnekStudio/releases/tags/nightly | jq -r '.assets[] | select(.name | test("SnekStudio_Linux-x86_64.*\\.tar\\.gz$")) | .browser_download_url')
          ARM64_URL=$(curl -s https://api.github.com/repos/ExpiredPopsicle/SnekStudio/releases/tags/nightly | jq -r '.assets[] | select(.name | test("SnekStudio_Linux-arm64.*\\.tar\\.gz$")) | .browser_download_url')
          echo "amd64_url=$AMD64_URL" >> $GITHUB_OUTPUT
          echo "arm64_url=$ARM64_URL" >> $GITHUB_OUTPUT
          echo "AMD64_URL=$AMD64_URL" >> $GITHUB_ENV
          echo "ARM64_URL=$ARM64_URL" >> $GITHUB_ENV

      - name: Check if new nightly
        id: check-url
        run: |
          CURRENT_AMD64_URL=$(jq -r '.AMD64_URL' update.json)
          CURRENT_ARM64_URL=$(jq -r '.ARM64_URL' update.json)

          if [ "$AMD64_URL" != "$CURRENT_AMD64_URL" ] || [ "$ARM64_URL" != "$CURRENT_ARM64_URL" ]; then
            echo "newnightly=true" >> $GITHUB_OUTPUT
            echo "New nightly build detected!"
          else
            echo "newnightly=false" >> $GITHUB_OUTPUT
            echo "No new nightly build found."
          fi

      - name: Update JSON file
        if: steps.check-url.outputs.newnightly == 'true'
        run: |
          jq --arg amd64_url "$AMD64_URL" --arg arm64_url "$ARM64_URL" \
            '.AMD64_URL = $amd64_url | .ARM64_URL = $arm64_url' \
            update.json > temp.json && mv temp.json update.json

      - name: Commit updated JSON
        if: steps.check-url.outputs.newnightly == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add update.json
          git commit -m "Update nightly URLs - $(date -u +%Y-%m-%d)"
          git push

  build_flatpak:
    needs: check_for_updates
    if: needs.check_for_updates.outputs.newnightly == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - name: Install deps
        run: |
          # Use the static binaries because it's unable to use a package manager 
          curl https://download.docker.com/linux/static/stable/x86_64/docker-28.3.3.tgz --output ./docker.tgz
          tar xzvf docker.tgz
          mv docker/* /usr/bin

      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: fetch
        shell: bash
        run: |
          wget ${{ needs.check_for_updates.outputs.amd64_url }}
          wget ${{ needs.check_for_updates.outputs.arm64_url }}

      - name: steup flatpak files
        shell: bash
        run: |
          cp ./flatpak/* .
          mkdir icons
          for size in "32x32" "64x64" "128x128" "256x256" "512x512"; do
            wget "https://github.com/ExpiredPopsicle/SnekStudio/blob/main/Core/UI/Images/icons/${size}.png?raw=true" -O "icons/${size}.png"
          done
          sed -i "s|AMD64_ARCHIVE|$(ls | grep x86_64)|g" com.snekstudio.Snekstudio.yaml
          sed -i "s|ARM64_ARCHIVE|$(ls | grep arm64)|g" com.snekstudio.Snekstudio.yaml
          cat com.snekstudio.Snekstudio.yaml

      - name: Build x64
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: SnekStudio_${{ env.FLATPAK_BRANCH }}_x86_64.flatpak
          manifest-path: com.snekstudio.Snekstudio.yaml
          cache: false
          upload-artifact: false
          branch: nightly
          arch: x86_64

      - run: mv repo ${FLATPAK_BUILD_REPO_x64}

      - name: Build aarch64
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: SnekStudio_${{ env.FLATPAK_BRANCH }}_aarch64.flatpak
          manifest-path: com.snekstudio.Snekstudio.yaml
          cache: false
          upload-artifact: false
          branch: nightly-aarch64
          arch: aarch64

      - run: mv repo ${FLATPAK_BUILD_REPO_arm64}

      - name: Upload built files as artifact
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-output
          path: |
            SnekStudio*.flatpak
            ${{ env.FLATPAK_BUILD_REPO_x64 }}/**
            !${{ env.FLATPAK_BUILD_REPO_x64 }}/.lock
            ${{ env.FLATPAK_BUILD_REPO_arm64 }}/**
            !${{ env.FLATPAK_BUILD_REPO_arm64 }}/.lock

  oci_publish:
    needs: build_flatpak
    runs-on: ubuntu-latest
    steps:
      - name: install deps
        run: |
          sudo apt-get update && sudo apt-get -y --no-install-recommends install skopeo flatpak jq

      - name: Download build bundles
        uses: actions/download-artifact@v8
        with:
          name: flatpak-output

      - run: ls

      - name: create oci bundle for x86_64
        run: |
          mkdir -p ${FLATPAK_BUILD_REPO_x64}/{extensions,refs/{mirrors,remotes},state,tmp/cache}
          flatpak build-bundle \
          --oci \
          --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
          ${FLATPAK_BUILD_REPO_x64} snekstudio-nightly com.snekstudio.Snekstudio nightly

      - name: publish oci bundle x86_64
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
          REGISTRY_AUTH_FILE: /tmp/auth.json
        run: |
          export IMAGE_REPOSITORY=$(echo $GITHUB_REPOSITORY | tr '[:upper:]' '[:lower:]')
          skopeo login --username "${{ github.actor }}" --password-stdin ghcr.io <<<$GITHUB_TOKEN
          skopeo copy \
           oci:snekstudio-nightly \
           docker://ghcr.io/${IMAGE_REPOSITORY}:nightly

      - name: create oci bundle for aarch64
        run: |
          mkdir -p ${FLATPAK_BUILD_REPO_arm64}/{extensions,refs/{mirrors,remotes},state,tmp/cache}
          flatpak build-bundle \
            --arch=aarch64 \
            --oci \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            ${FLATPAK_BUILD_REPO_arm64} snekstudio-nightly-aarch64 com.snekstudio.Snekstudio nightly-aarch64

      - name: publish oci bundle for aarch64
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
          REGISTRY_AUTH_FILE: /tmp/auth.json
        run: |
          export IMAGE_REPOSITORY=$(echo $GITHUB_REPOSITORY | tr '[:upper:]' '[:lower:]')
          skopeo login --username "${{ github.actor }}" --password-stdin ghcr.io <<<$GITHUB_TOKEN
          skopeo copy \
           oci:snekstudio-nightly-aarch64 \
           docker://ghcr.io/${IMAGE_REPOSITORY}:nightly-aarch64

  update-flatpak-oci-index:
    runs-on: ubuntu-latest
    needs: oci_publish
    steps:
      - run: echo "REPO_NAME=${{ github.event.repository.name }}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: "gh-pages"

      - name: Update static index
        env:
          REGISTRY_AUTH_FILE: /tmp/auth.json
        run: |
          export IMAGE_REPOSITORY=$(echo $GITHUB_REPOSITORY | tr '[:upper:]' '[:lower:]')
          set -x
          mkdir -p ./gh-pages/repos

          skopeo inspect docker://ghcr.io/${IMAGE_REPOSITORY}:nightly | \
            jq --arg github_repository "${GITHUB_REPOSITORY}" \
              '. as $img | { "Name": $github_repository, "Images": [$img] }' \
            > ./gh-pages/repos/${REPO_NAME}.o
          if [ -s ./gh-pages/repos/${REPO_NAME}.o ]; then
            mv ./gh-pages/repos/${REPO_NAME}.o ./gh-pages/repos/${REPO_NAME}
          else
            rm ./gh-pages/repos/${REPO_NAME}.o
          fi

          skopeo inspect docker://ghcr.io/${IMAGE_REPOSITORY}:nightly-aarch64 | \
            jq --arg github_repository "${GITHUB_REPOSITORY}" \
              '. as $img | { "Name": $github_repository, "Images": [$img] }' \
            > ./gh-pages/repos/${REPO_NAME}-aarch64.o
          if [ -s ./gh-pages/repos/${REPO_NAME}-aarch64.o ]; then
            mv ./gh-pages/repos/${REPO_NAME}-aarch64.o ./gh-pages/repos/${REPO_NAME}-aarch64
          else
            rm ./gh-pages/repos/${REPO_NAME}-aarch64.o
          fi

          git -C ./gh-pages add .
      - name: Check for changes
        id: is-updated
        run: |
          set -x
          git -C ./gh-pages status -s -uno
          ls ./gh-pages/repos/
          [ -z "$(git -C ./gh-pages status -s -uno)" ] || echo "updated=true" >> $GITHUB_OUTPUT

      - name: Push to repository
        if: steps.is-updated.outputs.updated
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git -C gh-pages pull
          git -C gh-pages commit --allow-empty -am "Update index $(date -u +%Y%m%d%H%M)"
          git -C gh-pages push
